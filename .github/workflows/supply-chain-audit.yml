name: Supply Chain Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # PYSEC-2026-1325: ecdsa==0.19.2 has no fix version available
          # (latest PyPI version is still 0.19.2). Remove this ignore once
          # upstream releases a fix. Revisit: https://github.com/tlsfuzzer/python-ecdsa
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --production --audit-level=high

      - name: Verify Python hash pinning
        run: grep -q -- '--hash=sha256' backend/requirements.txt

      - name: Verify Docker digest pinning
        run: |
          failed=0
          for f in backend/Dockerfile frontend/Dockerfile; do
            while IFS= read -r line; do
              if ! echo "$line" | grep -q '@sha256:'; then
                echo "::error::$f: digest not pinned — $line"
                failed=1
              fi
            done < <(grep '^FROM ' "$f")
          done
          exit "$failed"

      - name: Verify GitHub Actions SHA pinning
        run: |
          ! grep -rE 'uses:\s+[^@]+@v[0-9]' .github/workflows/

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0